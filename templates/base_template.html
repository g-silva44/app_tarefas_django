{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <title>taskfy - organize sua vida</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" type="text/css" href="{% static 'css/main.css' %}">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    <script src="https://kit.fontawesome.com/61838a8320.js" crossorigin="anonymous"></script>
</head>
<body>
<nav class="notebook-nav" aria-label="navegação principal">
    <div class="notebook-nav-inner">
        <a class="notebook-brand" href="{% url 'index' %}">
            taskfy<span>.</span>
        </a>

        <div class="notebook-links">
            <a href="{% url 'index' %}"
                    {% if request.resolver_match.url_name == 'index' %}
               class="is-current" aria-current="page"
                    {% endif %}>
                início
            </a>

            <a href="{% url 'tarefas_home' %}"
                    {% if request.resolver_match.url_name == 'tarefas_home' %}
               class="is-current" aria-current="page"
                    {% endif %}>
                tarefas
            </a>

            <a href="{% url 'pessoa_perfil' %}"
                    {% if request.resolver_match.url_name == 'pessoa_perfil' %}
               class="is-current" aria-current="page"
                    {% endif %}>
                meu perfil
            </a>
        </div>
    </div>
</nav>
<div class="container-fluid container-sm mt-5">
    {% block content %}
    {% endblock %}
</div>
</body>
</html>
